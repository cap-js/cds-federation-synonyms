_schema-version: 3.3.0
ID: capire.xtravels-j
version: 1.0.1
description: "CAP XTravels sample application (java)"
parameters:
  enable-parallel-deployments: true
modules:
  - name: xtravels-srv
    type: java
    path: srv
    parameters:
      instances: 1
      buildpack: sap_java_buildpack_jakarta
    properties:
      SPRING_PROFILES_ACTIVE: cloud,sandbox
      JBP_CONFIG_COMPONENTS: "jres: ['com.sap.xs.java.buildpack.jre.SAPMachineJRE']"
      JBP_CONFIG_SAP_MACHINE_JRE: '{ version: 25.+ }'
      CDS_MULTITENANCY_APPUI_TENANTSEPARATOR: "-"
    build-parameters:
      builder: custom
      commands:
        - mvn clean package -DskipTests=true --batch-mode
      build-result: target/*-exec.jar
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: xtravels-auth
      - name: xtravels-db
      - name: mtx-api
        properties:
          CDS_MULTITENANCY_SIDECAR_URL: ~{mtx-url}
      - name: xtravels-registry
      - name: app-api
        properties:
          CDS_MULTITENANCY_APPUI_URL: ~{url}

  - name: xtravels
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: xtravels-auth
      - name: mtx-api
        group: destinations
        properties:
          name: mtx-api # must be used in xs-app.json as well
          url: ~{mtx-url}
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}
          url: ${default-url}
    properties:
      TENANT_HOST_PATTERN: "^(.*)-${default-uri}"

  - name: xtravels-mtx
    type: nodejs
    path: mtx/sidecar
    requires:
      - name: xtravels-auth
      - name: xtravels-db
      - name: xflights-db        # <----
    build-parameters:
      builder: custom
      build-result: gen
      commands:
        # cds build copies mtx/sidecar/package.json verbatim into gen/, where the plugin's
        # `file:../../../...tgz` path is one directory too shallow. Copy the tarball to the
        # app root so the path resolves from the generated gen/ directory.
        - cp ../../../cap-js-cds-federation-synonyms-0.0.1.tgz ../..
        - npm run build
      requires:
        - name: xtravels-srv
    properties:
      DEBUG: cds-federation-synonyms
    parameters:
      instances: 1
      memory: 256M
      disk-quota: 512M
    provides:
      - name: mtx-api
        properties:
          mtx-url: ${default-url}

resources:
  - name: xtravels-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: xtravels-${org}-${space}
        tenant-mode: shared
        role-collections:
          - name: 'xtravels-developer-${space}'
            description: Develop xtravels
            role-template-references:
              - $XSAPPNAME.DataFederationAdmin
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api

  - name: xtravels-db
    type: org.cloudfoundry.managed-service
    parameters:
      service: service-manager
      service-plan: container

  - name: xflights-db
    type: org.cloudfoundry.existing-service

  - name: xtravels-registry
    type: org.cloudfoundry.managed-service
    requires:
      - name: srv-api
    parameters:
      service: saas-registry
      service-plan: application
      config:
        xsappname: xtravels-${org}-${space}
        appName: xtravels-${org}-${space}
        displayName: xtravels
        description: A simple CAP project.
        category: 'Category'
        appUrls:
          getDependencies: ~{srv-api/srv-url}/mt/v1.0/subscriptions/dependencies
          onSubscription: ~{srv-api/srv-url}/mt/v1.0/subscriptions/tenants/{tenantId}
          onSubscriptionAsync: true
          onUnSubscriptionAsync: true
          onUpdateDependenciesAsync: true
          callbackTimeoutMillis: 300000 # Increase if your deployments are taking longer than that
